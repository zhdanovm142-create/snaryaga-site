<?xml version="1.0" encoding="utf-8"?>
<!-- Фавиконка бренда: зелёный квадрат с белым «С36». Единый дизайн со всеми
     PNG/ICO иконками (icon-512.png — растровая основа, векторный wrapper без
     зависимости от шрифтов). Яндекс предпочитает SVG-фавиконки — раньше тут
     был тёмный Z из шаблона (logo.svg), из-за него Яндекс показывал чужой дизайн. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <image width="512" height="512" xlink:href="data:image/png;base64,"/>
</svg>
